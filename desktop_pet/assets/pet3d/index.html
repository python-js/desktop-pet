<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Desktop Pet 3D</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden;
               user-select: none; -webkit-user-select: none; cursor: default; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<!-- <script src="fox.glb.js"></script> -->
<script src="husky.glb.js"></script>
<script>
(function () {
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  // 视野收窄、相机拉远：长身体的狐狸在走动转向时也不容易超出 220px 窗口。
  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 50);
  camera.position.set(0, 1.7, 10.0);
  camera.lookAt(0, 1.15, 0);

  scene.add(new THREE.HemisphereLight(0xfff6ea, 0x6d5a4d, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(3, 5.5, 6);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffe2c6, 0.5);
  fill.position.set(-4.5, 2.5, 3);
  scene.add(fill);

  // 落地阴影固定在场景地面，宠物起跳时仍贴地。
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = 256;
  shadowCanvas.height = 128;
  const ctx = shadowCanvas.getContext('2d');
  const gradient = ctx.createRadialGradient(128, 64, 4, 128, 64, 120);
  gradient.addColorStop(0, 'rgba(60, 44, 35, 0.3)');
  gradient.addColorStop(0.55, 'rgba(60, 44, 35, 0.12)');
  gradient.addColorStop(1, 'rgba(60, 44, 35, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 128);
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(2.0, 1.0),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(shadowCanvas),
      transparent: true,
      depthWrite: false
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.01;
  shadow.renderOrder = 1;
  shadow.visible = false;
  scene.add(shadow);

  const pet = new THREE.Group();
  scene.add(pet);

  const clock = new THREE.Clock();
  const gazeQuat = new THREE.Quaternion();
  const gazeEuler = new THREE.Euler();
  let mixer = null;
  let actions = {};
  let currentName = '';
  let headBone = null;
  let ready = false;
  let paused = false;
  let elapsed = 0;
  let gazeX = 0;
  let gazeY = 0;
  let gazeTargetX = 0;
  let gazeTargetY = 0;
  let dragging = false;
  let dragAmount = 0;
  let reactUntil = 0;
  let runActive = false;
  let runUntil = 0;
  let runDuration = 1.2;
  let walking = false;
  let walkDir = 1;
  const REACT_DURATION = 0.9;
  const REST_YAW = 0.35;
  const WALK_YAW = 0.62;
  let walkAmount = 0;
  let walkYaw = REST_YAW;
  pet.rotation.y = REST_YAW;

  // file:// 下 fetch/XHR 会被拦截，模型以 base64 内嵌后直接解析。
  const loader = new THREE.GLTFLoader();
  const binary = atob(window.HUSKY_GLB_BASE64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
  loader.parse(bytes.buffer, '', function (gltf) {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const scale = 2.4 / size.y;
    model.scale.setScalar(scale);
    model.position.set(-(box.min.x + box.max.x) / 2 * scale,
                       -box.min.y * scale,
                       -(box.min.z + box.max.z) / 2 * scale);
    pet.add(model);

    model.traverse(function (node) {
      if (node.isBone && !headBone && /head/i.test(node.name)) { headBone = node; }
    });

    mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(function (clip) {
      const action = mixer.clipAction(clip);
      if (clip.name === 'Gallop_Jump') {
        action.setLoop(THREE.LoopOnce, 1);
        action.clampWhenFinished = true;
        runDuration = clip.duration;
      }
      actions[clip.name] = action;
    });

    ready = true;
    shadow.visible = true;
    playAction('Idle', 0);
    if (paused) { renderer.render(scene, camera); }
  }, function (error) {
    console.error('哈士奇模型加载失败', error);
  });

  function playAction(name, fade) {
    const next = actions[name];
    if (!next) { return; }
    if (name === currentName) {
      if (name === 'Gallop_Jump') { next.reset(); next.play(); }
      return;
    }
    const prev = actions[currentName];
    next.reset();
    next.setEffectiveWeight(1);
    next.play();
    if (fade > 0) {
      next.fadeIn(fade);
      if (prev) { prev.fadeOut(fade); }
    } else if (prev) {
      prev.stop();
    }
    currentName = name;
  }

  function updateAction(fade) {
    if (!ready || runActive) { return; }
    playAction(walking ? 'Walk' : 'Idle', fade === undefined ? 0.2 : fade);
  }

  function animate() {
    const delta = Math.min(clock.getDelta(), 0.1);
    elapsed += delta;

    // Gallop_Jump 是一次性的点击反应；这里按时间兜底，进度暂停时也不会卡住。
    if (runActive && elapsed >= runUntil) {
      runActive = false;
      updateAction(0.18);
    }
    if (mixer) { mixer.update(delta); }

    // 视线：在动画写入骨骼姿态后叠加头部旋转，跟随鼠标方向。
    gazeX += (gazeTargetX - gazeX) * Math.min(1, delta * 9);
    gazeY += (gazeTargetY - gazeY) * Math.min(1, delta * 9);
    if (headBone) {
      headBone.quaternion.multiply(
        gazeQuat.setFromEuler(gazeEuler.set(gazeY * 0.18, gazeX * 0.32, 0)));
    }

    // 点击反应：0.9 秒的小跳。
    const reactLeft = Math.max(0, reactUntil - elapsed);
    const react = reactLeft > 0 ? Math.sin((1 - reactLeft / REACT_DURATION) * Math.PI) : 0;

    // 被拖动时轻微离地并晃动，像被拎在手里。
    dragAmount += ((dragging ? 1 : 0) - dragAmount) * Math.min(1, delta * 10);

    // 巡逻走动：身体随步频起伏并转向行进方向。
    walkAmount += ((walking ? 1 : 0) - walkAmount) * Math.min(1, delta * 8);
    const walkPhase = elapsed * Math.PI * 2 / 1.042;
    pet.position.y = 0.015 * walkAmount * Math.abs(Math.sin(walkPhase))
      + 0.14 * react + 0.05 * dragAmount;
    pet.rotation.z = 0.05 * dragAmount * Math.sin(elapsed * 8);
    walkYaw += ((walking ? WALK_YAW * walkDir : REST_YAW) - walkYaw) * Math.min(1, delta * 8);
    pet.rotation.y = walkYaw;

    shadow.material.opacity = 1 - 0.3 * react;

    renderer.render(scene, camera);
  }

  function resetWalkPose() {
    walkAmount = 0;
    walkYaw = REST_YAW;
    pet.rotation.y = REST_YAW;
  }

  function setPaused(value) {
    paused = !!value;
    if (paused) {
      resetWalkPose();
      renderer.setAnimationLoop(null);
      renderer.render(scene, camera);
    } else {
      clock.getDelta();
      renderer.setAnimationLoop(animate);
    }
  }

  function resize() {
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }

  window.pet3d = {
    setPaused: setPaused,
    lookAt: function (x, y) {
      gazeTargetX = Math.max(-1, Math.min(1, x || 0));
      gazeTargetY = Math.max(-1, Math.min(1, y || 0));
    },
    react: function () {
      if (!ready) { return; }
      runActive = true;
      reactUntil = elapsed + REACT_DURATION;
      runUntil = elapsed + Math.max(0.6, runDuration - 0.15);
      playAction('Gallop_Jump', 0.12);
    },
    setDragging: function (value) {
      dragging = !!value;
    },
    setWalking: function (value, direction) {
      walking = !!value;
      walkDir = direction < 0 ? -1 : 1;
      updateAction(0.22);
    }
  };
  window.addEventListener('resize', resize);
  resize();
  renderer.setAnimationLoop(animate);
})();
</script>
</body>
</html>
