<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Desktop Pet 3D</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden;
               user-select: none; -webkit-user-select: none; cursor: default; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<!-- <script src="fox.glb.js"></script> -->
<script src="husky.glb.js"></script>
<script>
(function () {
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  // 视野收窄、相机拉远：长身体的狐狸在走动转向时也不容易超出 220px 窗口。
  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 50);
  camera.position.set(0, 1.7, 10.0);
  camera.lookAt(0, 1.15, 0);

  scene.add(new THREE.HemisphereLight(0xfff6ea, 0x6d5a4d, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(3, 5.5, 6);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffe2c6, 0.5);
  fill.position.set(-4.5, 2.5, 3);
  scene.add(fill);

  // 落地阴影固定在场景地面，宠物起跳时仍贴地。
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = 256;
  shadowCanvas.height = 128;
  const ctx = shadowCanvas.getContext('2d');
  const gradient = ctx.createRadialGradient(128, 64, 4, 128, 64, 120);
  gradient.addColorStop(0, 'rgba(60, 44, 35, 0.3)');
  gradient.addColorStop(0.55, 'rgba(60, 44, 35, 0.12)');
  gradient.addColorStop(1, 'rgba(60, 44, 35, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 128);
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(2.0, 1.0),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(shadowCanvas),
      transparent: true,
      depthWrite: false
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.01;
  shadow.renderOrder = 1;
  shadow.visible = false;
  scene.add(shadow);

  const pet = new THREE.Group();
  scene.add(pet);

  const clock = new THREE.Clock();
  const gazeQuat = new THREE.Quaternion();
  const gazeParent = new THREE.Quaternion();
  const gazeLocal = new THREE.Quaternion();
  const gazeEuler = new THREE.Euler();
  let mixer = null;
  let actions = {};
  let currentName = '';
  let gazeBone = null;
  let ready = false;
  let paused = false;
  let elapsed = 0;
  let gazeX = 0;
  let gazeY = 0;
  let gazeTargetX = 0;
  let gazeTargetY = 0;
  let dragging = false;
  let dragAmount = 0;
  let reactUntil = 0;
  let busyUntil = 0;
  let reactDuration = 1.2;
  let deathDuration = 1.2;
  let eatingDuration = 1.2;
  let walking = false;
  let walkDir = 1;
  let walkGait = 'walk';
  let pendingPause = false;
  let idleSince = 0;
  let nextEatAt = 8 + Math.random() * 12;
  const REACT_HOP = 0.9;
  const REST_YAW = 0.35;
  const WALK_YAW = 0.62;
  const ONCE = {
    Gallop_Jump: true, Attack: true, Eating: true, Death: true,
    Jump_ToIdle: true, Idle_HitReact_Left: true, Idle_HitReact_Right: true
  };
  let walkAmount = 0;
  let walkYaw = REST_YAW;
  pet.rotation.y = REST_YAW;

  // file:// 下 fetch/XHR 会被拦截，模型以 base64 内嵌后直接解析。
  const loader = new THREE.GLTFLoader();
  const binary = atob(window.HUSKY_GLB_BASE64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
  loader.parse(bytes.buffer, '', function (gltf) {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const scale = 2.4 / size.y;
    model.scale.setScalar(scale);
    model.position.set(-(box.min.x + box.max.x) / 2 * scale,
                       -box.min.y * scale,
                       -(box.min.z + box.max.z) / 2 * scale);
    pet.add(model);

    // 哈士奇的两只耳朵挂在 Neck3 下，转 Head 只会带动鼻子；优先转 Neck3 让整个头一起转。
    model.traverse(function (node) {
      if (!node.isBone) { return; }
      if (/neck3/i.test(node.name)) { gazeBone = node; }
      else if (!gazeBone && /head/i.test(node.name)) { gazeBone = node; }
    });

    mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(function (clip) {
      // 跳过 AnimalArmature| 重名副本，只用短名剪辑。
      if (String(clip.name || '').indexOf('|') >= 0) { return; }
      const action = mixer.clipAction(clip);
      if (ONCE[clip.name]) {
        action.setLoop(THREE.LoopOnce, 1);
        action.clampWhenFinished = true;
      }
      if (clip.name === 'Gallop_Jump' || clip.name === 'Attack') {
        reactDuration = Math.max(reactDuration, clip.duration);
      }
      if (clip.name === 'Death') { deathDuration = clip.duration; }
      if (clip.name === 'Eating') { eatingDuration = clip.duration; }
      actions[clip.name] = action;
    });

    ready = true;
    shadow.visible = true;
    idleSince = 0;
    playAction('Idle', 0);
    if (paused) { renderer.render(scene, camera); }
  }, function (error) {
    console.error('哈士奇模型加载失败', error);
  });

  function playAction(name, fade) {
    const next = actions[name];
    if (!next) { return false; }
    if (name === currentName) {
      if (ONCE[name]) { next.reset(); next.play(); }
      return true;
    }
    const prev = actions[currentName];
    next.reset();
    next.setEffectiveWeight(1);
    next.play();
    if (fade > 0) {
      next.fadeIn(fade);
      if (prev) { prev.fadeOut(fade); }
    } else if (prev) {
      prev.stop();
    }
    currentName = name;
    return true;
  }

  function busy() {
    return elapsed < busyUntil || pendingPause;
  }

  function resolveMove() {
    // 壳子下发 walk / gallop；缺剪辑时回退到另一个。
    const want = walkGait === 'gallop' ? 'Gallop' : 'Walk';
    const other = want === 'Gallop' ? 'Walk' : 'Gallop';
    if (actions[want]) { return want; }
    if (actions[other]) { return other; }
    return 'Walk';
  }

  function updateAction(fade) {
    if (!ready || busy()) { return; }
    playAction(walking ? resolveMove() : 'Idle', fade === undefined ? 0.2 : fade);
  }

  function playOneshot(name, fade, pad) {
    if (!playAction(name, fade)) { return false; }
    const clip = actions[name].getClip();
    busyUntil = elapsed + Math.max(0.4, (clip ? clip.duration : 1) - (pad || 0.12));
    return true;
  }

  // 骨骼局部轴与世界竖直轴不一致，用世界坐标的偏航/俯仰换算到父骨骼空间后叠加。
  function applyGaze(bone, yaw, pitch) {
    bone.parent.getWorldQuaternion(gazeParent);
    gazeQuat.setFromEuler(gazeEuler.set(pitch, yaw, 0, 'YXZ'));
    gazeLocal.copy(gazeParent).invert().multiply(gazeQuat).multiply(gazeParent);
    bone.quaternion.premultiply(gazeLocal);
  }

  function animate() {
    const delta = Math.min(clock.getDelta(), 0.1);
    elapsed += delta;

    // 一次性动作结束后回 Idle/Gallop；Death 播完后真正暂停。
    if (busyUntil && elapsed >= busyUntil) {
      busyUntil = 0;
      if (pendingPause) {
        pendingPause = false;
        paused = true;
        resetWalkPose();
        renderer.setAnimationLoop(null);
        renderer.render(scene, camera);
        return;
      }
      idleSince = 0;
      nextEatAt = 10 + Math.random() * 16;
      updateAction(0.18);
    }

    // 待机一会儿后偶尔吃东西。
    if (!walking && !dragging && !busy() && currentName === 'Idle') {
      idleSince += delta;
      if (idleSince >= nextEatAt && actions.Eating) {
        idleSince = 0;
        playOneshot('Eating', 0.18, 0.1);
      }
    } else if (walking || dragging) {
      idleSince = 0;
    }

    if (mixer) { mixer.update(delta); }

    // 视线：在动画写入骨骼姿态后叠加旋转，让整个头（含耳朵）跟随鼠标方向。
    gazeX += (gazeTargetX - gazeX) * Math.min(1, delta * 9);
    gazeY += (gazeTargetY - gazeY) * Math.min(1, delta * 9);
    if (gazeBone) {
      applyGaze(gazeBone, gazeX * 0.32, -gazeY * 0.18);
    }

    // 点击反应：小跳（Attack / Gallop_Jump 共用 hop）。
    const reactLeft = Math.max(0, reactUntil - elapsed);
    const react = reactLeft > 0 ? Math.sin((1 - reactLeft / REACT_HOP) * Math.PI) : 0;

    // 被拖动时轻微离地并晃动，像被拎在手里。
    dragAmount += ((dragging ? 1 : 0) - dragAmount) * Math.min(1, delta * 10);

    // 巡逻起伏：Gallop 稍快，Walk 稍慢。
    walkAmount += ((walking ? 1 : 0) - walkAmount) * Math.min(1, delta * 8);
    const walkPhase = elapsed * Math.PI * 2 / (currentName === 'Gallop' ? 0.72 : 1.042);
    pet.position.y = 0.015 * walkAmount * Math.abs(Math.sin(walkPhase))
      + 0.14 * react + 0.05 * dragAmount;
    pet.rotation.z = 0.05 * dragAmount * Math.sin(elapsed * 8);
    walkYaw += ((walking ? WALK_YAW * walkDir : REST_YAW) - walkYaw) * Math.min(1, delta * 8);
    pet.rotation.y = walkYaw;

    shadow.material.opacity = 1 - 0.3 * react;

    renderer.render(scene, camera);
  }

  function resetWalkPose() {
    walkAmount = 0;
    walkYaw = REST_YAW;
    pet.rotation.y = REST_YAW;
  }

  function setPaused(value) {
    if (value) {
      walking = false;
      resetWalkPose();
      if (ready && actions.Death && !paused) {
        pendingPause = true;
        playOneshot('Death', 0.12, 0.05);
        renderer.setAnimationLoop(animate);
        return;
      }
      paused = true;
      pendingPause = false;
      busyUntil = 0;
      renderer.setAnimationLoop(null);
      renderer.render(scene, camera);
      return;
    }
    pendingPause = false;
    busyUntil = 0;
    paused = false;
    idleSince = 0;
    clock.getDelta();
    playAction('Idle', 0.15);
    renderer.setAnimationLoop(animate);
  }

  function resize() {
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }

  window.pet3d = {
    setPaused: setPaused,
    lookAt: function (x, y) {
      gazeTargetX = Math.max(-1, Math.min(1, x || 0));
      gazeTargetY = Math.max(-1, Math.min(1, y || 0));
    },
    react: function () {
      if (!ready || pendingPause) { return; }
      const pick = (actions.Attack && Math.random() < 0.45) ? 'Attack' : 'Gallop_Jump';
      reactUntil = elapsed + REACT_HOP;
      playOneshot(pick, 0.12, 0.12);
    },
    setDragging: function (value) {
      dragging = !!value;
    },
    setWalking: function (value, direction, gait) {
      walking = !!value;
      walkDir = direction < 0 ? -1 : 1;
      walkGait = gait === 'gallop' ? 'gallop' : 'walk';
      if (walking) {
        idleSince = 0;
        pendingPause = false;
        busyUntil = 0;
      }
      updateAction(0.22);
    }
  };
  window.addEventListener('resize', resize);
  resize();
  renderer.setAnimationLoop(animate);
})();
</script>
</body>
</html>
